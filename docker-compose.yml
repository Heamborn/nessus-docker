services:
  nessus:
    build:
      context: .
      args:
        # 拉不动 Docker Hub 时改成 public.ecr.aws/docker/library/ubuntu:22.04
        BASE_IMAGE: ubuntu:22.04
        NESSUS_VERSION: "10.12.6"
    image: nessus:10.12.6
    container_name: nessus
    restart: always
    environment:
      # 首次启动自动注册；不填则实例停在未注册状态，插件会被清空
      - ACTIVATION_CODE=${ACTIVATION_CODE:-}
    ports:
      - "8834:8834"
    volumes:
      # 插件包缓存：留着就不用每次重下 1GB
      - nessus_cache:/nessus/cache
      # 可选：持久化运行数据与插件本体。挂上后重建容器不用重新编译。
      # 两条要成对出现（只有 var 没有 plugins，重建后照样得重编）。
      # - nessus_data:/opt/nessus/var/nessus
      # - nessus_plugins:/opt/nessus/lib/nessus/plugins

volumes:
  nessus_cache:
  # nessus_data:
  # nessus_plugins:
