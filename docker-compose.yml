services:
  nessus:
    build:
      context: .
      args:
        NESSUS_VERSION: "10.12.6"
    image: nessus:10.12.6
    container_name: nessus
    restart: always
    ports:
      - "8834:8834"
    volumes:
      # 插件包缓存：留着就不用每次重下 1GB
      - nessus_cache:/nessus/cache
      # 可选：持久化运行数据与插件本体。挂上后重建容器不用重新编译。
      # 两条要成对出现（只有 var 没有 plugins，重建后照样得重编）。
      # - nessus_data:/opt/nessus/var/nessus
      # - nessus_plugins:/opt/nessus/lib/nessus/plugins

volumes:
  nessus_cache:
  # nessus_data:
  # nessus_plugins:
