services:
  nessus:
    build:
      context: .
      args:
        NESSUS_VERSION: "10.12.6"
    image: nessus:10.12.6
    container_name: nessus
    restart: always
    ports:
      - "8834:8834"
    volumes:
      # 插件包缓存：留着就不用每次重下 1GB
      - nessus_cache:/nessus/cache
      # 运行数据：用户/证书/已编译插件库（约 10GB），重建容器不用重新编译
      - nessus_data:/opt/nessus/var/nessus

volumes:
  nessus_cache:
  nessus_data:
